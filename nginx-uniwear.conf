# UNIWEAR Production Nginx Site Configuration for Hostinger KVM 2
# Save to: /etc/nginx/sites-available/uniwear
# Symlink: ln -s /etc/nginx/sites-available/uniwear /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name uniwear.co www.uniwear.co 200.141.15.107 _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Client body limit for file uploads (Product images, catalogs, etc.)
    client_max_body_size 25M;

    # 1. Frontend Static Files (Root)
    root /var/www/uniwear/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Static asset caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 2. Persistent Storage (Media Uploads - High Priority Prefix)
    location ^~ /storage/ {
        alias /var/www/uniwear/storage/;
        autoindex off;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 3. Backend API Reverse Proxy (High Priority Prefix)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for longer upload/export operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 4. Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
